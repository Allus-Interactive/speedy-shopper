name: "godot-ci export"

on:
  push:
    branches:
      - main

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: automation
  PROJECT_PATH: godot-project

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Get Game Version
        run: |
          VERSION=$(grep '^config/version=' "$PROJECT_PATH/project.godot" | cut -d'"' -f2)
          echo "GAME_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Game version: $VERSION"
      - name: Windows Build
        run: |
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Windows Desktop"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/playtest
      - name: Deploy
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push ./builds/playtest ${{ vars.ITCHIO_USERNAME }}/${{ vars.ITCHIO_GAME }}:windows
      - name: Announce Release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"content\": \"🎮 **Speedy Shopper has been updated!**\n\n**v$GAME_VERSION** is now available to download from itch.io!\n\nhttps://${{ vars.ITCHIO_USERNAME }}.itch.io/${{ vars.ITCHIO_GAME }}\"
            }" \
            "$DISCORD_WEBHOOK_URL"