name: "godot-ci export"

# on:
#   push:
#     branches:
#       - main

on:
  pull_request:
    types: [closed]
    branches:
      - main

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: automation
  PROJECT_PATH: godot-project

jobs:
  export-windows:
    if: github.event.pull_request.merged == true
    name: Windows Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          apt-get update
          apt-get install -y curl
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq
      - name: Get Game Version
        run: |
          VERSION=$(grep '^config/version=' "$PROJECT_PATH/project.godot" | cut -d'"' -f2)
          echo "GAME_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Game version: $VERSION"
      - name: Get Build Notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BUILD_NOTES=$(printf '%s\n' "$PR_BODY" | sed -n '/^## Build Notes$/,/^## /{/^## Build Notes$/d;/^## /d;p;}')
          
          {
            echo 'BUILD_NOTES<<EOF'
            echo "$BUILD_NOTES"
            echo 'EOF'
          } >> "$GITHUB_ENV"

          echo "Build notes:"
          echo "$BUILD_NOTES"
      - name: Windows Build
        run: |
          cd $PROJECT_PATH
          mkdir -v -p ../builds/playtest
          godot --headless --verbose --export-release "Windows Desktop"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/playtest
      - name: Deploy
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push ./builds/playtest ${{ vars.ITCHIO_USERNAME }}/${{ vars.ITCHIO_GAME }}:windows
      - name: Announce Release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PLAYTESTER_ROLE_ID: ${{ vars.DISCORD_PLAYTESTER_ROLE_ID }}
          ITCHIO_USERNAME: ${{ vars.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ vars.ITCHIO_GAME }}
        run: |
          ITCHIO_URL="https://${ITCHIO_USERNAME}.itch.io/${ITCHIO_GAME}"

          jq -n \
            --arg role "<@&${DISCORD_PLAYTESTER_ROLE_ID}>" \
            --arg version "$GAME_VERSION" \
            --arg notes "$BUILD_NOTES" \
            --arg url "$ITCHIO_URL" \
            '{
              content: $role,
              embeds: [
                {
                  title: ("🎮 Speedy Shopper v" + $version),
                  description: "A new playtest build is now available!",
                  fields: [
                    {
                      name: "Build Notes",
                      value: $notes
                    },
                    {
                      name: "Download",
                      value: ("[▶ Play on itch.io](" + $url + ")")
                    }
                  ]
                }
              ]
            }' > discord.json

          curl \
            -H "Content-Type: application/json" \
            --data-binary @discord.json \
            "$DISCORD_WEBHOOK_URL"